name: Actualizar RSS de GameBanana

on:
  schedule:
    - cron: "*/6 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Consultar GameBanana
        run: |
          python - <<'PY'
          import json
          import urllib.request
          import xml.etree.ElementTree as ET
          from email.utils import formatdate

          api = "https://api.gamebanana.com/Core/Item/Data?itemtype=Mod&itemid=723287&fields=name,udate&return_keys=true&format=json"

          request = urllib.request.Request(
              api,
              headers={"User-Agent": "Mozilla/5.0"}
          )

          with urllib.request.urlopen(request, timeout=30) as response:
              data = json.load(response)

          print("Respuesta de GameBanana:")
          print(data)

          name = data.get("name", "Vocaloid Pack: Extended Edition")
          update_id = str(data.get("udate", ""))

          tree = ET.parse("rss.xml")
          root = tree.getroot()
          channel = root.find("channel")

          item = channel.find("item")

          if item is None:
              item = ET.SubElement(channel, "item")

          def set_text(tag, value):
              element = item.find(tag)
              if element is None:
                  element = ET.SubElement(item, tag)
              element.text = value

          set_text("title", name)
          set_text("link", "https://gamebanana.com/mods/723287")
          set_text("description", "Nueva actualización de Vocaloid Pack: Extended Edition.")
          set_text("guid", "gamebanana-723287-" + update_id)

          guid = item.find("guid")
          guid.set("isPermaLink", "false")

          set_text("pubDate", formatdate(usegmt=True))

          ET.indent(root, space="  ")

          tree.write(
              "rss.xml",
              encoding="utf-8",
              xml_declaration=True
          )
          PY

      - name: Guardar RSS
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add rss.xml

          if git diff --cached --quiet; then
            echo "No hay cambios."
          else
            git commit -m "Actualizar RSS"
            git push
          fi
